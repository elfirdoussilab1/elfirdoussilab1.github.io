# Site settings
# This file is not reloaded by `jekyll serve`: restart the server after editing it.

locale             : "en-US"
title              : "Aymane El Firdoussi"
description        : "Aymane El Firdoussi, PhD Researcher."
url                : "https://elfirdoussilab1.github.io"
baseurl            : ""
repository         : "elfirdoussilab1/elfirdoussilab1.github.io"

# Used for the Google Scholar links until author.googlescholar is set
scholar_search_url : "https://scholar.google.com/citations?user=Noq0ExIAAAAJ&hl=en&oi=ao"

author:
  name           : "Aymane El Firdoussi"
  avatar         : "home_picture.webp"   # in /images/
  location       : "Cambridge, United Kingdom"
  email          : "ae606@cam.ac.uk"
  googlescholar  :                       # full profile URL, e.g. "https://scholar.google.com/citations?user=XXXXXXXXXXXX"
  github         : "elfirdoussilab1"     # username
  linkedin       : "aymane-el-firdoussi-4a7544225"  # profile id

# Build
include:
  - _pages
exclude:
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo

plugins:
  - jekyll-redirect-from
